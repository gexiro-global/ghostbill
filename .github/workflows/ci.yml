# =============================================================================
# GhostBill CI Pipeline
# =============================================================================
# Proves that GhostBill can be built, migrated, linted, formatted, and tested
# from a clean checkout using only test fixtures and non-production services.
#
# No wallet-rpc, no Tor, no production secrets, no frontend.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ruff
        run: pip install ruff>=0.15.0

      - name: ruff check
        run: ruff check --config backend/pyproject.toml backend/app/

      - name: ruff format
        run: ruff format --check --config backend/pyproject.toml backend/app/

  test:
    name: Build, Migrate & Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Create test environment
        run: cp .env.test.example .env.test

      - name: Build backend image
        run: docker compose -p ghostbill-ci -f docker-compose.test.yml build backend

      - name: Start PostgreSQL and Redis
        run: |
          docker compose -p ghostbill-ci -f docker-compose.test.yml up -d postgres redis
          sleep 5

      - name: Start backend (runs alembic + uvicorn)
        run: |
          docker compose -p ghostbill-ci -f docker-compose.test.yml up -d backend
          for i in $(seq 1 30); do
            if docker compose -p ghostbill-ci -f docker-compose.test.yml exec backend \
              curl -sf http://localhost:8000/health >/dev/null 2>&1; then
              echo "Backend healthy after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Backend failed to start"
              docker compose -p ghostbill-ci -f docker-compose.test.yml logs backend
              exit 1
            fi
            sleep 1
          done

      - name: Run tests
        run: |
          # CI runs wave5 only: service-level tests designed for CI.
          # wave1-4 + root tests excluded (host port deps, relative paths).
          # See scripts/ci-test.sh for full rationale.
          docker compose -p ghostbill-ci -f docker-compose.test.yml exec backend \
            python3 -m pytest \
              tests/wave5 \
              -v --tb=short

      - name: Teardown
        if: always()
        run: docker compose -p ghostbill-ci -f docker-compose.test.yml down -v --remove-orphans
