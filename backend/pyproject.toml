[project]
name = "ghostbill-backend"
version = "0.1.0"
description = "GhostBill - Monero Payment Gateway"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "redis>=5.2.0",
    "httpx[socks]>=0.28.0",
    "bcrypt>=4.2.0",
    "cryptography>=44.0.0",
    "python-multipart>=0.0.12",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
