[project]
name = "ghostbill-backend"
version = "1.2.0-beta"
description = "GhostBill - Monero Payment Gateway"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "redis>=5.2.0",
    "httpx[socks]>=0.28.0",
    "bcrypt>=4.2.0",
    "cryptography>=44.0.0",
    "python-multipart>=0.0.12",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "segno>=1.6.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E712",  # SQLAlchemy requires == True/False for column comparisons
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E501"]  # Long SQL strings and test signatures
"tests/conftest.py" = ["E501", "F401"]  # pytest import by convention + SQL

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = ["app"]
