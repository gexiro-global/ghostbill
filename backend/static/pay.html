<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GhostBill — Pay Invoice</title>
    <meta name="robots" content="noindex, nofollow">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #111118;
            --bg-card: #16161f;
            --bg-card-hover: #1c1c28;
            --border: #2a2a3a;
            --border-accent: #ff6b2d;
            --text-primary: #e8e8f0;
            --text-secondary: #8888a0;
            --text-muted: #555568;
            --accent: #ff6b2d;
            --accent-glow: rgba(255, 107, 45, 0.15);
            --green: #34d399;
            --green-dim: rgba(52, 211, 153, 0.15);
            --yellow: #fbbf24;
            --yellow-dim: rgba(251, 191, 36, 0.15);
            --red: #f87171;
            --red-dim: rgba(248, 113, 113, 0.15);
            --blue: #60a5fa;
            --blue-dim: rgba(96, 165, 250, 0.15);
            --mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
            --sans: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: var(--sans);
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        /* ── Noise overlay ── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 9999;
        }

        /* ── Logo ── */
        .logo {
            font-family: var(--mono);
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--text-primary);
            letter-spacing: -0.5px;
            margin-bottom: 32px;
            text-align: center;
        }

        .logo span { color: var(--accent); }

        /* ── Card ── */
        .pay-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 32px;
            width: 100%;
            max-width: 440px;
            position: relative;
        }

        /* ── Status Bar (top of card) ── */
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: var(--mono);
            font-size: 0.75rem;
            font-weight: 500;
            padding: 5px 12px;
            border-radius: 100px;
            letter-spacing: 0.3px;
        }

        .status-badge.pending { background: var(--accent-glow); color: var(--accent); }
        .status-badge.detected { background: var(--yellow-dim); color: var(--yellow); }
        .status-badge.paid { background: var(--green-dim); color: var(--green); }
        .status-badge.confirmed { background: var(--green-dim); color: var(--green); }
        .status-badge.expired { background: var(--red-dim); color: var(--red); }
        .status-badge.partially_paid { background: var(--yellow-dim); color: var(--yellow); }
        .status-badge.overpaid { background: var(--blue-dim); color: var(--blue); }
        .status-badge.late_paid { background: var(--yellow-dim); color: var(--yellow); }
        .status-badge.cancelled { background: rgba(85, 85, 104, 0.15); color: var(--text-muted); }

        .countdown {
            font-family: var(--mono);
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .countdown.urgent { color: var(--red); }

        /* ── Amount ── */
        .amount-section {
            text-align: center;
            margin-bottom: 24px;
        }

        .amount-xmr {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 4px;
        }

        .amount-xmr .unit {
            font-size: 1rem;
            color: var(--text-secondary);
            font-weight: 400;
            margin-left: 4px;
        }

        .amount-fiat {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .description {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 8px;
        }

        /* ── QR Code ── */
        .qr-section {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
        }

        .qr-wrapper {
            background: #ffffff;
            border-radius: 12px;
            padding: 16px;
            display: inline-block;
            line-height: 0;
        }

        .qr-wrapper svg {
            display: block;
            width: 200px;
            height: 200px;
        }

        /* ── Address ── */
        .address-section {
            margin-bottom: 24px;
        }

        .address-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .address-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 12px;
        }

        .address-text {
            font-family: var(--mono);
            font-size: 0.7rem;
            color: var(--text-secondary);
            word-break: break-all;
            flex: 1;
            line-height: 1.5;
        }

        .copy-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 6px 12px;
            border-radius: 6px;
            font-family: var(--mono);
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .copy-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .copy-btn.copied {
            border-color: var(--green);
            color: var(--green);
        }

        /* ── Confirmations ── */
        .confirmations-section {
            margin-bottom: 24px;
        }

        .confirmations-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .confirmations-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .confirmations-count {
            font-family: var(--mono);
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .progress-bar {
            height: 6px;
            background: var(--bg-secondary);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.5s ease;
            background: var(--accent);
        }

        .progress-fill.confirmed {
            background: var(--green);
        }

        /* ── Terminal states ── */
        .terminal-icon {
            text-align: center;
            font-size: 3rem;
            margin-bottom: 16px;
        }

        .terminal-message {
            text-align: center;
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .terminal-submessage {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* ── Paid amount info ── */
        .paid-info {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 24px;
        }

        .paid-info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
        }

        .paid-info-row + .paid-info-row {
            margin-top: 6px;
        }

        .paid-info-label {
            color: var(--text-muted);
        }

        .paid-info-value {
            font-family: var(--mono);
            color: var(--text-secondary);
        }

        /* ── Footer ── */
        .pay-footer {
            margin-top: 24px;
            text-align: center;
        }

        .pay-footer p {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .pay-footer a {
            color: var(--accent);
            text-decoration: none;
        }

        .pay-footer a:hover {
            text-decoration: underline;
        }

        /* ── Loading ── */
        .loading {
            text-align: center;
            padding: 60px 0;
        }

        .spinner {
            display: inline-block;
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-text {
            margin-top: 16px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* ── Error ── */
        .error-state {
            text-align: center;
            padding: 40px 0;
        }

        .error-state .terminal-icon { color: var(--red); }

        /* ── Hidden ── */
        .hidden { display: none !important; }

        /* ── Responsive ── */
        @media (max-width: 480px) {
            body { padding: 16px; }
            .pay-card { padding: 24px 20px; }
            .amount-xmr { font-size: 1.6rem; }
            .address-text { font-size: 0.65rem; }
            .qr-wrapper svg { width: 160px; height: 160px; }
        }
    </style>
</head>
<body>

<div class="logo">Ghost<span>Bill</span></div>

<div class="pay-card">
    <!-- Loading state -->
    <div id="loading-state" class="loading">
        <div class="spinner"></div>
        <p class="loading-text">Loading invoice...</p>
    </div>

    <!-- Error state -->
    <div id="error-state" class="error-state hidden">
        <div class="terminal-icon">⚠</div>
        <p class="terminal-message">Invoice not found</p>
        <p class="terminal-submessage">This invoice may not exist or has been removed.</p>
    </div>

    <!-- Invoice content -->
    <div id="invoice-content" class="hidden">
        <!-- Status bar -->
        <div class="status-bar">
            <div id="status-badge" class="status-badge pending">
                <span id="status-dot">●</span>
                <span id="status-text">Pending</span>
            </div>
            <div id="countdown" class="countdown"></div>
        </div>

        <!-- Amount -->
        <div class="amount-section">
            <div class="amount-xmr">
                <span id="amount-xmr">0.000000000000</span>
                <span class="unit">XMR</span>
            </div>
            <div id="amount-fiat" class="amount-fiat"></div>
            <div id="description" class="description"></div>
        </div>

        <!-- Payment section (QR + address) — hidden on terminal states -->
        <div id="payment-section">
            <!-- QR Code (server-side SVG) -->
            <div class="qr-section">
                <div class="qr-wrapper">
                    <div id="qr-code"></div>
                </div>
            </div>

            <!-- Address -->
            <div class="address-section">
                <div class="address-label">Send to address</div>
                <div class="address-box">
                    <span id="address-text" class="address-text"></span>
                    <button id="copy-btn" class="copy-btn" onclick="copyAddress()">COPY</button>
                </div>
            </div>
        </div>

        <!-- Confirmations (shown when payment detected) -->
        <div id="confirmations-section" class="confirmations-section hidden">
            <div class="confirmations-header">
                <span class="confirmations-label">Confirmations</span>
                <span id="confirmations-count" class="confirmations-count">0 / 10</span>
            </div>
            <div class="progress-bar">
                <div id="progress-fill" class="progress-fill" style="width: 0%"></div>
            </div>
        </div>

        <!-- Paid amount info (shown for partial/overpaid) -->
        <div id="paid-info" class="paid-info hidden">
            <div class="paid-info-row">
                <span class="paid-info-label">Required</span>
                <span id="paid-required" class="paid-info-value"></span>
            </div>
            <div class="paid-info-row">
                <span class="paid-info-label">Received</span>
                <span id="paid-received" class="paid-info-value"></span>
            </div>
        </div>

        <!-- Terminal state message -->
        <div id="terminal-state" class="hidden">
            <div id="terminal-icon" class="terminal-icon"></div>
            <p id="terminal-message" class="terminal-message"></p>
            <p id="terminal-submessage" class="terminal-submessage"></p>
        </div>
    </div>
</div>

<div class="pay-footer">
    <p>Powered by <a href="/">GhostBill</a> — Privacy-first Monero billing</p>
</div>

<script>
/**
 * GhostBill Payment Page
 * Standalone vanilla JS — zero external dependencies, Tor-safe
 * QR code generated server-side (segno library)
 * Phase 7B: SSE real-time with polling fallback
 */
(function() {
    'use strict';

    // ── Config ──────────────────────────────────────────────────────────────────
    var POLL_INTERVAL = 5000;
    var COUNTDOWN_INTERVAL = 1000;
    var TERMINAL_STATUSES = ['paid', 'expired', 'cancelled'];
    var SSE_RECONNECT_DELAY = 3000;

    // ── State ───────────────────────────────────────────────────────────────────
    var invoiceId = null;
    var invoiceData = null;
    var pollTimer = null;
    var countdownTimer = null;
    var eventSource = null;
    var sseActive = false;

    // ── DOM refs ────────────────────────────────────────────────────────────────
    var els = {};

    function initRefs() {
        var ids = [
            'loading-state', 'error-state', 'invoice-content',
            'status-badge', 'status-dot', 'status-text', 'countdown',
            'amount-xmr', 'amount-fiat', 'description',
            'payment-section', 'qr-code', 'address-text', 'copy-btn',
            'confirmations-section', 'confirmations-count', 'progress-fill',
            'paid-info', 'paid-required', 'paid-received',
            'terminal-state', 'terminal-icon', 'terminal-message', 'terminal-submessage'
        ];
        for (var i = 0; i < ids.length; i++) {
            els[ids[i]] = document.getElementById(ids[i]);
        }
    }

    // ── Extract invoice ID from URL ─────────────────────────────────────────
    function getInvoiceId() {
        var parts = window.location.pathname.split('/');
        for (var i = 0; i < parts.length; i++) {
            if (parts[i] === 'pay' && parts[i + 1]) {
                return parts[i + 1];
            }
        }
        return null;
    }

    // ── API call ────────────────────────────────────────────────────────────────
    function fetchInvoice(callback) {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', '/v1/invoices/' + invoiceId + '/public', true);
        xhr.timeout = 10000;
        xhr.onreadystatechange = function() {
            if (xhr.readyState !== 4) return;
            if (xhr.status === 200) {
                try {
                    callback(null, JSON.parse(xhr.responseText));
                } catch (e) {
                    callback(e, null);
                }
            } else {
                callback(new Error('HTTP ' + xhr.status), null);
            }
        };
        xhr.onerror = function() { callback(new Error('Network error'), null); };
        xhr.ontimeout = function() { callback(new Error('Timeout'), null); };
        xhr.send();
    }

    // ── Render invoice ──────────────────────────────────────────────────────────
    function render(data) {
        invoiceData = data;
        var st = data.status;

        // Status badge
        els['status-badge'].className = 'status-badge ' + st;
        els['status-text'].textContent = formatStatus(st);

        // Amount
        els['amount-xmr'].textContent = formatXMR(data.amount_xmr);

        if (data.fiat_amount && data.fiat_currency) {
            els['amount-fiat'].textContent = '\u2248 ' + data.fiat_currency + ' ' + parseFloat(data.fiat_amount).toFixed(2);
            els['amount-fiat'].classList.remove('hidden');
        }

        if (data.description) {
            els['description'].textContent = data.description;
            els['description'].classList.remove('hidden');
        }

        // Address
        if (data.address) {
            els['address-text'].textContent = data.address;
        }

        // Decide what to show based on status
        var isTerminal = TERMINAL_STATUSES.indexOf(st) !== -1;
        var hasPayment = data.paid_amount_atomic > 0;
        var isWaiting = (st === 'pending');
        var isDetected = (st === 'partially_paid' || st === 'overpaid' || st === 'late_paid');

        // Confirmations
        if (hasPayment && data.confirmations !== undefined) {
            var confs = data.confirmations;
            var required = data.confirmations_required || 10;
            var pct = Math.min(100, Math.round((confs / required) * 100));

            els['confirmations-count'].textContent = confs + ' / ' + required;
            els['progress-fill'].style.width = pct + '%';

            if (confs >= required) {
                els['progress-fill'].classList.add('confirmed');
            }

            els['confirmations-section'].classList.remove('hidden');
        } else {
            els['confirmations-section'].classList.add('hidden');
        }

        // Paid info (for partial/overpaid)
        if (isDetected || (st === 'paid' && hasPayment)) {
            var reqXMR = formatXMR(data.amount_xmr);
            var paidXMR = atomicToXMR(data.paid_amount_atomic);
            els['paid-required'].textContent = reqXMR + ' XMR';
            els['paid-received'].textContent = paidXMR + ' XMR';
            els['paid-info'].classList.remove('hidden');
        } else {
            els['paid-info'].classList.add('hidden');
        }

        // QR code (only for pending — server-side SVG)
        if (isWaiting && data.qr_svg) {
            els['qr-code'].innerHTML = data.qr_svg;
            els['payment-section'].classList.remove('hidden');
        } else if (isDetected && data.address) {
            // Still show address for partial payments, hide QR
            els['qr-code'].innerHTML = '';
            els['payment-section'].classList.remove('hidden');
        } else {
            els['payment-section'].classList.add('hidden');
        }

        // Terminal states
        if (st === 'paid') {
            showTerminal('\u2713', 'Payment Confirmed', 'Thank you! This invoice has been paid.');
            els['payment-section'].classList.add('hidden');
        } else if (st === 'expired') {
            showTerminal('\u2717', 'Invoice Expired', 'This invoice has expired. Please request a new one.');
            els['payment-section'].classList.add('hidden');
        } else if (st === 'cancelled') {
            showTerminal('\u2014', 'Invoice Cancelled', 'This invoice was cancelled by the merchant.');
            els['payment-section'].classList.add('hidden');
        } else {
            els['terminal-state'].classList.add('hidden');
        }

        // Countdown (only for pending/partially_paid)
        if (st === 'pending' || st === 'partially_paid') {
            startCountdown(data.expires_at);
        } else {
            els['countdown'].textContent = '';
            if (countdownTimer) {
                clearInterval(countdownTimer);
                countdownTimer = null;
            }
        }

        // Stop updates on terminal states
        if (isTerminal) {
            stopPolling();
            disconnectSSE();
        }
    }

    function showTerminal(icon, msg, sub) {
        els['terminal-icon'].textContent = icon;
        els['terminal-message'].textContent = msg;
        els['terminal-submessage'].textContent = sub;
        els['terminal-state'].classList.remove('hidden');
    }

    function formatStatus(s) {
        var map = {
            'pending': 'Awaiting Payment',
            'paid': 'Paid',
            'expired': 'Expired',
            'partially_paid': 'Partially Paid',
            'overpaid': 'Overpaid',
            'late_paid': 'Late Payment',
            'cancelled': 'Cancelled'
        };
        return map[s] || s;
    }

    function formatXMR(val) {
        var n = parseFloat(val);
        if (isNaN(n)) return val;
        return n.toFixed(12);
    }

    function atomicToXMR(atomic) {
        var val = atomic / 1000000000000;
        return val.toFixed(12);
    }

    // ── Countdown ───────────────────────────────────────────────────────────────
    function startCountdown(expiresAt) {
        if (countdownTimer) clearInterval(countdownTimer);

        var target = new Date(expiresAt).getTime();

        function tick() {
            var now = Date.now();
            var diff = target - now;

            if (diff <= 0) {
                els['countdown'].textContent = '0:00:00';
                els['countdown'].classList.add('urgent');
                clearInterval(countdownTimer);
                countdownTimer = null;
                if (!sseActive) poll();
                return;
            }

            var hours = Math.floor(diff / 3600000);
            var mins = Math.floor((diff % 3600000) / 60000);
            var secs = Math.floor((diff % 60000) / 1000);

            var timeStr = hours + ':' + pad2(mins) + ':' + pad2(secs);
            els['countdown'].textContent = timeStr;

            if (diff < 300000) {
                els['countdown'].classList.add('urgent');
            } else {
                els['countdown'].classList.remove('urgent');
            }
        }

        tick();
        countdownTimer = setInterval(tick, COUNTDOWN_INTERVAL);
    }

    function pad2(n) { return n < 10 ? '0' + n : '' + n; }

    // ── SSE (Phase 7B) ─────────────────────────────────────────────────────────
    function connectSSE() {
        if (typeof EventSource === 'undefined') {
            // Browser doesn't support SSE — use polling
            startPolling();
            return;
        }

        var url = '/v1/invoices/' + invoiceId + '/events';
        eventSource = new EventSource(url);
        sseActive = true;

        eventSource.addEventListener('update', function(e) {
            try {
                var data = JSON.parse(e.data);
                render(data);
            } catch (err) {
                // Ignore parse errors
            }
        });

        eventSource.addEventListener('close', function() {
            disconnectSSE();
        });

        eventSource.onerror = function() {
            // SSE failed — fall back to polling
            disconnectSSE();
            setTimeout(function() {
                // Try SSE again after delay; if still fails, polling continues
                if (!sseActive && TERMINAL_STATUSES.indexOf((invoiceData || {}).status) === -1) {
                    connectSSE();
                }
            }, SSE_RECONNECT_DELAY);

            // Start polling as immediate fallback
            if (!pollTimer && TERMINAL_STATUSES.indexOf((invoiceData || {}).status) === -1) {
                startPolling();
            }
        };
    }

    function disconnectSSE() {
        if (eventSource) {
            eventSource.close();
            eventSource = null;
        }
        sseActive = false;
    }

    // ── Polling (fallback) ───────────────────────────────────────────────────
    function startPolling() {
        if (pollTimer) return;
        poll();
        pollTimer = setInterval(poll, POLL_INTERVAL);
    }

    function stopPolling() {
        if (pollTimer) {
            clearInterval(pollTimer);
            pollTimer = null;
        }
    }

    function poll() {
        fetchInvoice(function(err, data) {
            if (err) return;
            render(data);

            // If SSE reconnects, stop polling
            if (sseActive && pollTimer) {
                stopPolling();
            }
        });
    }

    // ── Copy to clipboard ───────────────────────────────────────────────────
    window.copyAddress = function() {
        if (!invoiceData || !invoiceData.address) return;

        var text = invoiceData.address;
        var btn = els['copy-btn'];

        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(function() {
                showCopied(btn);
            }).catch(function() {
                fallbackCopy(text, btn);
            });
        } else {
            fallbackCopy(text, btn);
        }
    };

    function fallbackCopy(text, btn) {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        ta.style.top = '-9999px';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        try {
            document.execCommand('copy');
            showCopied(btn);
        } catch (e) {
            btn.textContent = 'FAIL';
        }
        document.body.removeChild(ta);
    }

    function showCopied(btn) {
        btn.textContent = 'COPIED';
        btn.classList.add('copied');
        setTimeout(function() {
            btn.textContent = 'COPY';
            btn.classList.remove('copied');
        }, 2000);
    }

    // ── Init ────────────────────────────────────────────────────────────────────
    function init() {
        initRefs();
        invoiceId = getInvoiceId();

        if (!invoiceId) {
            showError('Invalid invoice URL');
            return;
        }

        fetchInvoice(function(err, data) {
            if (err) {
                showError('Invoice not found');
                return;
            }

            els['loading-state'].classList.add('hidden');
            els['invoice-content'].classList.remove('hidden');

            render(data);

            // Start real-time updates (SSE preferred, polling fallback)
            if (TERMINAL_STATUSES.indexOf(data.status) === -1) {
                connectSSE();
            }
        });
    }

    function showError(msg) {
        els['loading-state'].classList.add('hidden');
        els['error-state'].classList.remove('hidden');
        if (msg) {
            els['error-state'].querySelector('.terminal-message').textContent = msg;
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>

</body>
</html>
