# =============================================================
# GhostBill Clearnet Nginx Reverse Proxy (example config)
#
# Replace 'yourdomain.com' with your actual domain.
# Update Cloudflare IP ranges periodically:
#   https://www.cloudflare.com/ips/
# =============================================================

# --- Restrict to Cloudflare IPs only ---
geo $is_cloudflare {
    default         0;
    # Cloudflare IPv4 (updated 2026-04)
    173.245.48.0/20   1;
    103.21.244.0/22   1;
    103.22.200.0/22   1;
    103.31.4.0/22     1;
    141.101.64.0/18   1;
    108.162.192.0/18  1;
    190.93.240.0/20   1;
    188.114.96.0/20   1;
    197.234.240.0/22  1;
    198.41.128.0/17   1;
    162.158.0.0/15    1;
    104.16.0.0/13     1;
    104.24.0.0/14     1;
    172.64.0.0/13     1;
    131.0.72.0/22     1;
    # Cloudflare IPv6
    2400:cb00::/32    1;
    2606:4700::/32    1;
    2803:f800::/32    1;
    2405:b500::/32    1;
    2405:8100::/32    1;
    2a06:98c0::/29    1;
    2c0f:f248::/32    1;
}

# --- Rate limiting ---
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=10r/s;

# --- HTTP -> HTTPS redirect ---
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# --- Default: reject direct IP access ---
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/nginx/certs/origin.crt;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    return 444;
}

# =============================================================
# yourdomain.com — Landing page + public pay page
# =============================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    ssl_certificate     /etc/nginx/certs/origin.crt;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    server_tokens off;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    if ($is_cloudflare = 0) { return 403; }

    limit_req zone=general_limit burst=20 nodelay;

    # Public payment page
    location ~ ^/pay/[0-9a-f-]{36}$ {
        proxy_pass http://ghostbill_backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }

    # Public invoice API (for pay page polling/SSE)
    location ~ ^/v1/invoices/[0-9a-f-]{36}/(public|events)$ {
        proxy_pass http://ghostbill_backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Accel-Buffering no;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }

    # XMR price (public)
    location = /v1/price {
        proxy_pass http://ghostbill_backend:8000;
        proxy_set_header Host $host;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }

    # www redirect
    if ($host = www.yourdomain.com) {
        return 301 https://yourdomain.com$request_uri;
    }

    # Everything else: 404
    location / {
        return 404;
    }
}

# =============================================================
# api.yourdomain.com — FastAPI backend (authenticated)
# =============================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.yourdomain.com;

    ssl_certificate     /etc/nginx/certs/origin.crt;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;

    if ($is_cloudflare = 0) { return 403; }

    limit_req zone=api_limit burst=50 nodelay;
    access_log off;

    location / {
        proxy_pass http://ghostbill_backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
        client_max_body_size 1m;
    }
}

# =============================================================
# dashboard.yourdomain.com — Next.js frontend (authenticated)
# =============================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dashboard.yourdomain.com;

    ssl_certificate     /etc/nginx/certs/origin.crt;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    server_tokens off;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    if ($is_cloudflare = 0) { return 403; }

    limit_req zone=general_limit burst=30 nodelay;

    location / {
        proxy_pass http://ghostbill_frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
