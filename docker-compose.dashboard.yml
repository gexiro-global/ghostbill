# GhostBill Dashboard — Docker Compose override
# Usage: docker compose -f docker-compose.yml -f docker-compose.dashboard.yml up -d
# Requires: ghostbill-dashboard source in ./frontend/
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ghostbill_frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:3013:3000"
    networks:
      - ghostbill_net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/login',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
